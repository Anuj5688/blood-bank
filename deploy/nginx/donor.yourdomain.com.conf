# /etc/nginx/sites-available/donor.yourdomain.com
# Static Vite build for the donor-facing app.
# Certbot will rewrite this to add the SSL (443) server block automatically
# after you run `certbot --nginx`. This starting version is HTTP-only.

server {
    listen 80;
    listen [::]:80;
    server_name donor.yourdomain.com;

    root /var/www/blood-bank/donor-app;
    index index.html;

    # SPA fallback — client-side router (wouter) handles the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html itself is not
    # cached so new deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
